<!DOCTYPE html>
<html lang="ku" dir="ltr" id="html-root">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartServe — مێنیوی دیجیتاڵ</title>
    <link rel="icon" type="image/png" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0C0A1B" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SmartServe">
    <script>(function(){try{var t=localStorage.getItem('landing_theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;border:0;outline:0}
        :root,:root[data-theme="dark"]{--gold:#6366F1;--gold2:#8B5CF6;--gold3:#A78BFA;--bg:#0C0A1B;--card:#16132C;--card2:#1E1A3C;--text:#EDEBFB;--sub:#938CC2;--line:rgba(139,92,246,.20);--wa:#25D366;--blue1:#3B82F6;--blue2:#60A5FA;--blue3:#93C5FD;--cyan:#06B6D4;--purple:#8B5CF6;--header-bg:rgba(20,11,0,.82);--menu-bg:rgba(20,11,0,.96)}
        :root[data-theme="light"]{--bg:#F3F1FF;--card:#FFFFFF;--card2:#EEF0FF;--text:#1A1535;--sub:#5B5680;--line:rgba(99,102,241,.22);--header-bg:rgba(255,255,255,.9);--menu-bg:rgba(255,255,255,.98)}
        :root[data-theme="light"] .glow{opacity:.28}
        :root[data-theme="light"] .orbit{opacity:.2}
        :root[data-theme="light"] .brand .bt{text-shadow:none}
        html{scroll-behavior:smooth;overflow-x:hidden;width:100%;min-width:100%;text-align:left}
        body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden;margin:0;padding:0;width:100%;min-width:100%;text-align:left}
        a{text-decoration:none;color:inherit}
        .g{color:var(--gold)}
        .wrap{margin:0 auto;padding:0 20px;width:100%;max-width:1180px;box-sizing:border-box;text-align:center;display:block;position:static;float:none;clear:both}
        .glow{position:fixed;width:480px;height:480px;border-radius:50%;filter:blur(40px);z-index:0;pointer-events:none;opacity:.6}
        .glow.a{top:-160px;inset-inline-end:-120px;background:radial-gradient(circle,rgba(99,102,241,.4),rgba(59,130,246,.3),transparent 70%);animation:floatGlow1 8s ease-in-out infinite}
        .glow.b{bottom:-180px;inset-inline-start:-120px;background:radial-gradient(circle,rgba(139,92,246,.4),rgba(6,182,212,.3),transparent 70%);animation:floatGlow2 10s ease-in-out infinite}
        .glow.c{top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.25),rgba(99,102,241,.2),transparent 70%);animation:floatGlow3 12s ease-in-out infinite}
        @keyframes floatGlow1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}}
        @keyframes floatGlow2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-25px,35px) scale(1.15)}}
        @keyframes floatGlow3{0%,100%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}50%{transform:translate(-50%,-50%) scale(1.2) rotate(180deg)}}
        .orbit{position:fixed;border-radius:50%;border:2px solid transparent;z-index:0;pointer-events:none;opacity:.4}
        .orbit::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:var(--blue1);animation:spin 4s linear infinite}
        .orbit::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-bottom-color:var(--cyan);border-left-color:var(--purple);animation:spin 6s linear infinite reverse}
        .orbit.a{top:-180px;inset-inline-end:-140px;width:500px;height:500px}
        .orbit.b{bottom:-200px;inset-inline-start:-140px;width:520px;height:520px}
        .orbit.c{top:50%;left:50%;transform:translate(-50%,-50%);width:650px;height:650px}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

        /* HEADER */
        header{position:sticky;top:0;z-index:50;background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
        .nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
        .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap}
        .brand .mk{font-size:26px}
        .brand .brand-logo{width:38px;height:38px;border-radius:10px;object-fit:cover;display:block;animation:logoFloat 3.2s ease-in-out infinite}
        @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0);filter:drop-shadow(0 0 6px rgba(99,102,241,.55))}50%{transform:translateY(-3px) rotate(-1.5deg);filter:drop-shadow(0 0 16px rgba(139,92,246,.95))}}
        .brand .bt{display:inline-flex;align-items:center;gap:0;color:var(--text);min-width:8em;text-shadow:0 0 20px rgba(99,102,241,.5)}
        .brand .brand-tw{display:inline-block;border-inline-end:2px solid transparent;padding-inline-end:1px}
        .brand .brand-tw.typing{border-inline-end-color:var(--gold);animation:brandCaret .7s step-end infinite}
        @keyframes brandCaret{50%{border-color:transparent}}
        .brand .brand-sep{color:var(--gold);font-weight:800;font-size:.95em;padding-inline-start:5px;animation:sepPulse 1.5s ease-in-out infinite}
        @keyframes sepPulse{0%,100%{opacity:.5;text-shadow:0 0 6px rgba(99,102,241,.35)}50%{opacity:1;text-shadow:0 0 14px rgba(139,92,246,.85);transform:scale(1.08)}}
        .brand .g{background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-inline-start:1px;font-weight:900}
        .menu{display:flex;align-items:center;gap:18px;flex:1;justify-content:flex-end}
        .menu a.navlink{font-size:14px;color:var(--sub);font-weight:600;transition:all .3s;position:relative}
        .menu a.navlink::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--blue1));transition:width .3s}
        .menu a.navlink:hover{color:var(--text)}
        .menu a.navlink:hover::after{width:100%}
        .nav-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-inline-start:8px}
        .nav-toggle{display:none;flex-shrink:0;width:42px;height:42px;align-items:center;justify-content:center;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:0;transition:border-color .2s,background .2s}
        .nav-toggle:hover{border-color:var(--gold)}
        .nav-toggle span{display:block;width:18px;height:2px;border-radius:2px;background:var(--text);transition:transform .25s,opacity .2s}
        header.nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
        header.nav-open .nav-toggle span:nth-child(2){opacity:0}
        header.nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
        .theme-toggle{flex-shrink:0;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--text);transition:border-color .2s,background .2s,color .2s}
        .theme-toggle:hover{border-color:var(--gold);color:var(--gold)}
        .theme-toggle svg{width:18px;height:18px;display:block}
        .theme-toggle .ico-sun{display:none}
        .theme-toggle .ico-moon{display:block}
        :root[data-theme="light"] .theme-toggle .ico-sun{display:block}
        :root[data-theme="light"] .theme-toggle .ico-moon{display:none}
        .hub-back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--gold2),var(--gold));padding:8px 14px;border-radius:50px;white-space:nowrap;box-shadow:0 6px 18px rgba(99,102,241,.35);transition:transform .2s,box-shadow .2s}
        .hub-back:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.5)}
        .hub-back svg{width:16px;height:16px;flex-shrink:0}
        .lang-sw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:50px;padding:3px}
        .lang-btn{background:none;border:none;color:var(--sub);font-family:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:50px;cursor:pointer;transition:all .2s}
        .lang-btn.on{background:var(--gold);color:#fff}
        .dash-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff!important;font-size:13px;font-weight:800;padding:8px 16px;border-radius:50px;white-space:nowrap;box-shadow:0 6px 18px rgba(139,92,246,.35);transition:transform .2s}
        .dash-btn:hover{transform:translateY(-2px)}
        .login-link{border:1px solid var(--line);padding:8px 15px;border-radius:50px;color:var(--text)!important;font-size:13px;white-space:nowrap}
        .login-link:hover{border-color:var(--gold);background:var(--card)}

        /* HERO */
        .hero{position:relative;z-index:1;text-align:center;padding:78px 0 64px}
        .pill{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--gold);font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:50px;margin-bottom:22px}
        .hero h1{font-size:46px;font-weight:900;letter-spacing:.3px;line-height:1.3;margin-bottom:16px;text-shadow:0 0 40px rgba(99,102,241,.3),0 4px 20px rgba(0,0,0,.3)}
        .hero p{font-size:17px;color:var(--sub);max-width:620px;margin:0 auto 30px}
        .cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--blue1));color:#fff;font-size:16px;font-weight:800;padding:16px 30px;border-radius:14px;box-shadow:0 10px 30px rgba(139,92,246,.45),0 0 60px rgba(99,102,241,.3);transition:all .3s;position:relative;overflow:hidden}
        .cta::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
        .cta:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(139,92,246,.6),0 0 80px rgba(99,102,241,.5)}
        .cta:hover::before{left:100%}
        .hero-ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
        .cta-ghost{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800;padding:15px 26px;border-radius:14px;color:var(--text);background:transparent;border:1px solid var(--line);transition:all .3s}
        .cta-ghost:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 28px rgba(99,102,241,.25);color:#fff}
        .hero .note{margin-top:14px;font-size:13px;color:var(--sub)}

        /* SECTIONS */
        section{position:relative;z-index:1;padding:60px 0;margin:0;width:100%}
        .stitle{text-align:center;margin-bottom:42px;position:relative}
        .stitle h2{font-size:30px;font-weight:800;text-shadow:0 0 30px rgba(99,102,241,.2);position:relative;display:inline-block}
        .stitle h2::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:60px;height:3px;background:linear-gradient(90deg,var(--gold),var(--blue1));border-radius:2px}
        .stitle p{color:var(--sub);font-size:15px;margin-top:16px}

        .feats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
        .feat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:24px 18px;text-align:center;transition:all .3s;position:relative}
        .feat::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(99,102,241,.1),transparent 70%);opacity:0;transition:opacity .3s}
        .feat-border{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:2;overflow:hidden}
        .feat-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
        .feat:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 40px rgba(99,102,246,.2)}
        .feat:hover::before{opacity:1}
        .feat-inner{position:relative;z-index:1}
        @keyframes borderCW{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-1400}}
        @keyframes borderCCW{0%{stroke-dashoffset:0}100%{stroke-dashoffset:1400}}
        .path-cw,.path-ccw{
            fill:none;stroke-width:1.75;stroke-linecap:round;
            stroke-dasharray:52 1350;stroke-dashoffset:0;
            animation-timing-function:linear;animation-iteration-count:infinite;
        }
        .path-cw{
            stroke:var(--blue1);
            filter:drop-shadow(0 0 5px rgba(99,102,241,.55)) drop-shadow(0 0 10px rgba(6,182,212,.35));
            animation-name:borderCW;animation-duration:9s;
        }
        .path-ccw{
            stroke:var(--cyan);
            filter:drop-shadow(0 0 5px rgba(6,182,212,.45)) drop-shadow(0 0 10px rgba(99,102,241,.3));
            animation-name:borderCCW;animation-duration:11s;
        }
        @media (prefers-reduced-motion:reduce){
            .path-cw,.path-ccw{animation:none!important;opacity:.35}
        }
        .feat:hover .path-cw,.step:hover .path-cw,.cust:hover .path-cw,.client-feature:hover .path-cw,.gcard:hover .path-cw,.plan:hover .path-cw,.formcard:hover .path-cw,.compare-col:hover .path-cw,.price-diff:hover .path-cw{
            stroke:var(--gold);filter:drop-shadow(0 0 6px rgba(201,168,76,.65)) drop-shadow(0 0 12px rgba(6,182,212,.35));
            animation-duration:6.5s;
        }
        .feat:hover .path-ccw,.step:hover .path-ccw,.cust:hover .path-ccw,.client-feature:hover .path-ccw,.gcard:hover .path-ccw,.plan:hover .path-ccw,.formcard:hover .path-ccw,.compare-col:hover .path-ccw,.price-diff:hover .path-ccw{
            stroke:var(--cyan);filter:drop-shadow(0 0 6px rgba(6,182,212,.55)) drop-shadow(0 0 12px rgba(201,168,76,.3));
            animation-duration:7.5s;
        }
        .feat .fi{font-size:34px;margin-bottom:12px}
        .feat h3{font-size:15px;font-weight:800;margin-bottom:7px}
        .feat p{font-size:12.5px;color:var(--sub);line-height:1.8}

        /* COMPARE */
        .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:860px;margin:0 auto}
        .compare-col{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:24px 20px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s,transform .3s}
        .compare-col.digital{border-color:rgba(99,102,241,.45);box-shadow:0 12px 36px rgba(99,102,241,.12)}
        .compare-border{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:2;overflow:hidden}
        .compare-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
        .compare-inner{position:relative;z-index:1}
        .compare-col:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 40px rgba(99,102,246,.18)}
        .compare-col h3{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center}
        .compare-col ul{list-style:none;display:flex;flex-direction:column;gap:10px}
        .compare-col li{font-size:13.5px;color:var(--sub);line-height:1.6;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid transparent}
        .compare-col.paper li{opacity:.85}
        .compare-col.digital li{color:var(--text);border-color:rgba(99,102,241,.15)}
        .compare-tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:10px}
        .compare-col.paper .compare-tag{background:rgba(248,113,113,.15);color:#fca5a5}
        .compare-col.digital .compare-tag{background:rgba(99,102,241,.2);color:var(--gold)}

        /* FAQ */
        .faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
        .faq-item{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .25s}
        .faq-item[open]{border-color:var(--gold)}
        .faq-item summary{cursor:pointer;list-style:none;padding:16px 18px;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .faq-item summary::-webkit-details-marker{display:none}
        .faq-item summary::after{content:'+';flex-shrink:0;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(99,102,241,.15);color:var(--gold);font-size:16px;font-weight:700;transition:transform .2s}
        .faq-item[open] summary::after{content:'–'}
        .faq-item .faq-a{padding:12px 18px 18px;font-size:13.5px;color:var(--sub);line-height:1.75;display:block;border-top:1px solid transparent}
        .faq-item[open] .faq-a{border-top-color:var(--line)}

        .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
        .step{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;transition:all .3s;position:relative}
        .step::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(99,102,241,.05),rgba(59,130,246,.05));opacity:0;transition:opacity .3s}
        .step-border{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:2}
        .step-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
        .step:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 40px rgba(99,102,246,.25)}
        .step:hover::before{opacity:1}
        .step-inner{position:relative;z-index:1}
        .step .num{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--blue1));color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 25px rgba(99,102,241,.4);position:relative}
        .step .num::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--blue1));opacity:.3;animation:pulse 2s ease-in-out infinite;z-index:-1}
        @keyframes pulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.2);opacity:.1}}
        .step h3{font-size:16px;font-weight:800;margin-bottom:8px}
        .step p{font-size:13px;color:var(--sub)}

        /* STATS BAND */
        .statsband{background:linear-gradient(135deg,var(--card2),var(--card));border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:40px 0}
        .statsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center}
        .statbox .sn{font-size:38px;font-weight:900;background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
        .statbox .sl{margin-top:8px;color:var(--sub);font-size:13.5px;font-weight:600}

        /* CUSTOMERS */
        .custs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
        .cust{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;transition:all .3s;position:relative}
        .cust::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(99,102,241,.08),transparent 70%);opacity:0;transition:opacity .3s}
        .cust-border{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:2}
        .cust-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
        .cust:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 40px rgba(99,102,246,.2)}
        .cust:hover::before{opacity:1}
        .cust-inner{position:relative;z-index:1}
        .cust .lg{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px;overflow:hidden}
        .cust .lg img{width:100%;height:100%;object-fit:cover}
        .cust .cn{font-weight:800;font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cust .cadr{font-size:11.5px;color:var(--sub);margin-bottom:12px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cust .qrbox{width:124px;height:124px;margin:0 auto 12px;background:#fff;border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:center}
        .cust .qrbox canvas,.cust .qrbox svg{width:112px!important;height:112px!important}
        .cust .vm{display:inline-block;font-size:12.5px;font-weight:700;color:var(--gold);border:1px solid var(--line);border-radius:9px;padding:7px 18px;transition:all .3s;position:relative;overflow:hidden}
        .cust .vm::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(99,102,241,.2),transparent);transition:left .5s}
        .cust .vm:hover{border-color:var(--gold);background:var(--card2);box-shadow:0 4px 15px rgba(99,102,246,.2)}
        .cust .vm:hover::before{left:100%}
        .cust.extra{display:none}
        .cust.extra.show{display:block}
        .morewrap{text-align:center;margin-top:34px}
        .morebtn{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;font-weight:700;padding:12px 28px;border-radius:50px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
        .morebtn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(99,102,241,.2),transparent);transition:left .5s}
        .morebtn:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(99,102,246,.2)}
        .morebtn:hover::before{left:100%}

        /* FEATURED CLIENT */
        .client-feature{display:flex;align-items:center;gap:28px;max-width:760px;margin:0 auto;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:28px 32px;box-shadow:0 18px 50px rgba(139,92,246,.16);transition:all .3s;position:relative}
        .client-feature::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(99,102,241,.06),transparent 70%);opacity:0;transition:opacity .3s}
        .client-border{position:absolute;inset:0;border-radius:22px;pointer-events:none;z-index:2;overflow:hidden}
        .client-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:22px}
        .client-feature:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 22px 60px rgba(99,102,246,.25)}
        .client-feature:hover::before{opacity:1}
        .client-inner{position:relative;z-index:1;display:flex;align-items:center;gap:28px;width:100%}
        .client-feature + .client-feature{margin-top:20px}
        .cf-logo{flex:none;width:78px;height:78px;border-radius:20px;overflow:hidden;background:transparent;box-shadow:0 8px 22px rgba(0,0,0,.35)}
        .cf-logo img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
        .cf-info{flex:1;text-align:start}
        .cf-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(37,211,102,.12);color:var(--wa);font-size:11.5px;font-weight:800;letter-spacing:.5px;padding:5px 12px;border-radius:50px;margin-bottom:10px}
        .cf-dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:cfpulse 1.8s infinite}
        @keyframes cfpulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 9px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
        .cf-name{font-size:22px;font-weight:900;margin-bottom:4px}
        .cf-desc{font-size:13.5px;color:var(--sub);margin-bottom:16px}
        .cf-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--blue1));color:#fff;font-size:14px;font-weight:800;padding:11px 22px;border-radius:12px;box-shadow:0 8px 22px rgba(139,92,246,.4),0 0 40px rgba(99,102,241,.2);transition:all .3s;position:relative;overflow:hidden}
        .cf-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
        .cf-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(139,92,246,.5),0 0 50px rgba(99,102,241,.3)}
        .cf-btn:hover::before{left:100%}
        .cf-qr{flex:none}
        .cf-qr .qrbox{width:128px;height:128px;background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center}
        .cf-qr .qrbox canvas,.cf-qr .qrbox svg{width:112px!important;height:112px!important}

        /* DESIGN STYLES GALLERY */
        .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
        .gcard{margin:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(160deg,var(--card2),var(--card));transition:all .3s;position:relative;display:flex;flex-direction:column}
        .gcard::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(99,102,241,.05),rgba(59,130,246,.05));opacity:0;transition:opacity .3s;z-index:1;pointer-events:none}
        .gcard-border{position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:2}
        .gcard-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:20px}
        .gcard:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 20px 50px rgba(99,102,246,.3)}
        .gcard:hover::before{opacity:1}
        .gcard-inner{position:relative;z-index:1;display:flex;flex-direction:column;flex:1}
        .gzoom{display:block;padding:0;margin:0;border:none;background:transparent;cursor:zoom-in;overflow:hidden;font:inherit;color:inherit;width:100%}
        .gcard img{display:block;width:100%;height:auto;transition:transform .4s}
        .gcard:hover .gzoom img{transform:scale(1.03)}
        .gcap{padding:14px 16px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
        .gcodes{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--gold);background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.28);padding:5px 11px;border-radius:999px}
        .gcap p{font-size:13px;color:var(--sub);line-height:1.5;margin:0}
        .gcta{margin-top:4px;align-self:stretch;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--blue1));color:#fff;font-family:inherit;font-size:13.5px;font-weight:800;padding:11px 16px;border:none;border-radius:12px;cursor:pointer;box-shadow:0 8px 20px rgba(139,92,246,.35);transition:transform .25s,box-shadow .25s}
        .gcta:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(139,92,246,.45)}

        /* LIGHTBOX */
        .lightbox{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,6,20,.88);backdrop-filter:blur(6px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
        .lightbox.open{opacity:1;visibility:visible;pointer-events:auto}
        .lightbox img{max-width:min(960px,100%);max-height:88vh;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55);border:1px solid var(--line)}
        .lb-close{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
        .lb-close:hover{background:rgba(255,255,255,.2)}

        /* PRICING */
        .plans{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:900px;margin:0 auto}
        .plan{background:linear-gradient(160deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:24px;padding:38px 30px 32px;text-align:center;box-shadow:0 18px 50px rgba(139,92,246,.22);position:relative;transition:all .3s}
        .plan::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(99,102,246,.08),rgba(59,130,246,.05),transparent 70%);opacity:0;transition:opacity .3s}
        .plan-border{position:absolute;inset:0;border-radius:24px;pointer-events:none;z-index:2}
        .plan-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:24px}
        .plan:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 22px 60px rgba(99,102,246,.3)}
        .plan:hover::before{opacity:1}
        .plan.pro{border-color:var(--gold);box-shadow:0 18px 50px rgba(139,92,246,.3),0 0 80px rgba(99,102,246,.2);padding-top:48px}
        .plan-inner{position:relative;z-index:1}
        .plan .pbadge{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:3;width:max-content;max-width:calc(100% - 24px);white-space:nowrap;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-size:12px;font-weight:800;padding:6px 18px;border-radius:50px;box-shadow:0 8px 20px rgba(139,92,246,.35);pointer-events:none}
        .plan .pn{font-size:18px;font-weight:800;color:var(--text);margin:0 0 8px;line-height:1.3}
        .plan .ptag{display:inline-block;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;margin-bottom:14px;border:1px solid var(--line);color:var(--sub);background:rgba(255,255,255,.04)}
        .plan.standard .ptag{color:#93c5fd;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.12)}
        .plan.pro .ptag{color:var(--gold);border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.15)}
        .plan .pp{font-size:48px;font-weight:900;line-height:1;margin-bottom:8px}
        .plan .pp small{font-size:15px;color:var(--sub);font-weight:700}
        .plan .pr{color:var(--gold);font-weight:800;margin:12px 0 4px;font-size:14px}
        .plan .pnote{color:var(--sub);font-size:12.5px;margin-bottom:24px;line-height:1.6}
        .plan ul{list-style:none;text-align:start;margin:0 0 26px}
        .plan li{padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:flex-start}
        .plan li::before{content:"✓";color:var(--gold);font-weight:900;flex-shrink:0;margin-top:1px}
        .plan .pcta{display:flex;width:100%;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--blue1));color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:14px;box-shadow:0 10px 26px rgba(139,92,246,.4),0 0 40px rgba(99,102,246,.3);transition:all .3s;position:relative;overflow:hidden}
        .plan .pcta::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
        .plan .pcta:hover{transform:translateY(-2px);box-shadow:0 14px 35px rgba(139,92,246,.5),0 0 50px rgba(99,102,246,.4)}
        .plan .pcta:hover::before{left:100%}

        .price-diff{max-width:900px;margin:28px auto 0;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;transition:border-color .3s,box-shadow .3s}
        .price-diff:hover{border-color:var(--gold);box-shadow:0 14px 40px rgba(99,102,246,.18)}
        .price-diff-border{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:2;overflow:hidden}
        .price-diff-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
        .price-diff-inner{position:relative;z-index:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
        .price-diff-head{padding:18px 18px 8px;text-align:center}
        .price-diff-head h3{font-size:18px;font-weight:800;margin-bottom:6px}
        .price-diff-head p{font-size:13px;color:var(--sub)}
        .price-diff-table{width:100%;border-collapse:collapse;font-size:13px}
        .price-diff-table th,.price-diff-table td{padding:12px 14px;border-top:1px solid var(--line);text-align:start;vertical-align:middle}
        .price-diff-table th{font-size:12px;font-weight:800;color:var(--sub);background:rgba(0,0,0,.15)}
        .price-diff-table td:first-child{font-weight:700;color:var(--text);width:28%}
        .price-diff-table .pro-cell{color:var(--gold);font-weight:700}
        .price-diff-table tr:last-child td{background:rgba(99,102,241,.08)}

        @media(max-width:1024px){
            .wrap{max-width:100%;padding:0 16px}
            .feats{grid-template-columns:repeat(3,1fr)}
            .gallery{grid-template-columns:repeat(2,1fr)}
        }

            header{position:sticky}

                flex-direction:column;align-items:stretch;gap:4px;flex:none;
                padding:12px 14px 16px;margin:0;justify-content:flex-start;

                font-size:15px;font-weight:700;color:var(--text);background:rgba(99,102,241,.06);border:1px solid transparent
            }

            .client-inner{flex-direction:column;text-align:center;gap:16px}
            .plan{padding:32px 20px 26px}
            .plan .pp{font-size:40px}
            .plan .pbadge{font-size:11px;padding:5px 14px;max-width:calc(100% - 16px);white-space:normal;text-align:center;line-height:1.3}
            .formcard{padding:26px 16px;max-width:100%}

            .hero h1{font-size:30px}
            .hero p{font-size:14.5px}
            .stitle h2{font-size:22px}
            .grid2{grid-template-columns:1fr}
            .hero-ctas{flex-direction:column}
            .cta,.cta-ghost{width:100%;justify-content:center}
            .feats{grid-template-columns:1fr;gap:10px}
            .feat{padding:18px 14px}
            .steps{gap:10px}
            .gallery{gap:12px}
            .custs{gap:10px}

        /* FORM */
        .formsec{background:linear-gradient(180deg,transparent,rgba(201,168,76,.05))}
        .formcard{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
        .formcard:hover{border-color:var(--gold);box-shadow:0 16px 40px rgba(99,102,246,.2)}
        .form-border{position:absolute;inset:0;border-radius:22px;pointer-events:none;z-index:2;overflow:hidden}
        .form-border svg{position:absolute;inset:0;width:100%;height:100%;border-radius:22px}
        .form-inner{position:relative;z-index:1}
        .fg{margin-bottom:16px}

        .fg input:focus,.fg textarea:focus{border-color:var(--gold);box-shadow:0 4px 20px rgba(99,102,246,.3),0 0 40px rgba(99,102,241,.15)}
        .fg textarea{resize:vertical;min-height:80px}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .send{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-size:16px;font-weight:800;border:none;border-radius:14px;padding:16px;cursor:pointer;font-family:inherit;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(37,211,102,.3)}
        .send::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
        .send:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 14px 40px rgba(37,211,102,.4)}
        .send:hover::before{left:100%}
        .fmsg{text-align:center;font-size:13px;margin-top:12px;min-height:18px}
        .fmsg.err{color:#ff7a7a}.fmsg.ok{color:var(--wa)}

        /* FOOTER */
        footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--sub);font-size:13px}
        .credit{margin-top:8px;font-size:12.5px}
        .credit a{color:var(--gold);font-weight:700}
        .credit a:hover{text-decoration:underline}
        .socials{margin-top:18px;display:inline-flex;align-items:center;gap:14px}
        .socials a{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:#fff;transition:all .3s;position:relative;overflow:hidden}
        .socials a::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .5s}
        .socials a:hover{transform:translateY(-4px) scale(1.1)}
        .socials a:hover::before{left:100%}
        .socials .s-insta{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888)}

    <script src="js/i18n.js"></script>
    <script>
        // ⚠ ژمارەی واتساپی خۆت لێرە دابنێ (کۆدی وڵات + ژمارە، بێ + و بێ بۆشایی)
        const WA_NUMBER = '9647506454656';

        function sendWa(){
            const v = id => (document.getElementById(id).value || '').trim();
            const rest = v('f-rest'), name = v('f-name'), phone = v('f-phone'), city = v('f-city'), note = v('f-note');
            const msg = document.getElementById('fmsg');
            if (!rest || !phone){ msg.className = 'fmsg err'; msg.textContent = t('lnd_form_err'); return; }
            const bar = '\u{2501}'.repeat(18);
            const p2 = n => String(n).padStart(2, '0');
            const now = new Date();
            const stamp = p2(now.getDate()) + '/' + p2(now.getMonth() + 1) + '/' + now.getFullYear() + ' - ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
            const lines = [
                '*SmartServe*',
                t('lnd_wa_req'),
                bar,
                '*' + t('lnd_wa_place') + ':* ' + rest,
                '*' + t('lnd_wa_name') + ':* ' + (name || '-'),
                '*' + t('lnd_wa_phone') + ':* ' + phone,
                '*' + t('lnd_wa_city') + ':* ' + (city || '-')
            ];
            if (note) lines.push('*' + t('lnd_wa_note') + ':* ' + note);
            lines.push('*' + t('lnd_wa_time') + ':* ' + stamp);
            lines.push(bar);
            lines.push('Smart-Serve | ' + t('lnd_wa_footer'));
            msg.className = 'fmsg ok'; msg.textContent = t('lnd_form_ok');
            window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
        }

        // زمان لە i18n.js کۆنترۆڵ دەکرێت — لێرە تەنها جاری دەکەینەوە (متن + جهت)
        window.I18N.setLang(window.I18N.getLang());

        // ── Dark / light theme ──
        (function(){
            const root = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            const meta = document.getElementById('meta-theme-color');
            function current(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
            function applyTheme(mode){
                root.setAttribute('data-theme', mode);
                try { localStorage.setItem('landing_theme', mode); } catch (e) {}
                if (meta) meta.setAttribute('content', mode === 'light' ? '#F3F1FF' : '#0C0A1B');
                if (btn){
                    const next = mode === 'light' ? 'theme_dark' : 'theme_light';
                    btn.title = t(next);
                    btn.setAttribute('aria-label', t(next));
                }
            }
            applyTheme(current());
            if (btn) btn.addEventListener('click', function(){
                applyTheme(current() === 'light' ? 'dark' : 'light');
            });
            document.addEventListener('langchange', function(){ applyTheme(current()); });
        })();

        // ── Mobile nav menu ──
        (function(){
            const header = document.getElementById('site-header');
            const toggle = document.getElementById('nav-toggle');
            const menu = document.getElementById('site-menu');
            if (!header || !toggle || !menu) return;

            function setOpen(open){
                header.classList.toggle('nav-open', open);
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                toggle.title = t(open ? 'lnd_nav_menu_close' : 'lnd_nav_menu');
            }
            function closeNav(){ setOpen(false); }

            toggle.addEventListener('click', function(e){
                e.stopPropagation();
                setOpen(!header.classList.contains('nav-open'));
            });
            menu.querySelectorAll('a.navlink, a.hub-back').forEach(function(a){
                a.addEventListener('click', closeNav);
            });
            document.addEventListener('click', function(e){
                if (!header.classList.contains('nav-open')) return;
                if (!header.contains(e.target)) closeNav();
            });
            document.addEventListener('keydown', function(e){
                if (e.key === 'Escape') closeNav();
            });
            window.addEventListener('resize', function(){
                if (window.matchMedia('(min-width:901px)').matches) closeNav();
            });
            document.addEventListener('langchange', function(){
                toggle.title = t(header.classList.contains('nav-open') ? 'lnd_nav_menu_close' : 'lnd_nav_menu');
            });
        })();

        // ── Design styles: lightbox + request CTA ──
        (function(){
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lb-img');
            const lbClose = document.getElementById('lb-close');
            if (!lb || !lbImg) return;

            function openLb(src, alt){
                lbImg.src = src;
                lbImg.alt = alt || '';
                lb.classList.add('open');
                lb.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }
            function closeLb(){
                lb.classList.remove('open');
                lb.setAttribute('aria-hidden', 'true');
                lbImg.removeAttribute('src');
                document.body.style.overflow = '';
            }

            document.querySelectorAll('.gzoom').forEach(function(btn){
                btn.addEventListener('click', function(){
                    const img = btn.querySelector('img');
                    if (img) openLb(img.currentSrc || img.src, img.alt);
                });
            });
            if (lbClose) lbClose.addEventListener('click', closeLb);
            lb.addEventListener('click', function(e){ if (e.target === lb) closeLb(); });
            document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && lb.classList.contains('open')) closeLb(); });

            document.querySelectorAll('.gcta').forEach(function(btn){
                btn.addEventListener('click', function(){
                    const card = btn.closest('.gcard');
                    const style = (card && card.getAttribute('data-style')) || '';
                    const note = document.getElementById('f-note');
                    if (note) note.value = t('lnd_style_note').replace('{style}', style);
                    const form = document.getElementById('form');
                    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    else location.hash = '#form';
                });
            });
        })();

        // ── QR codes for customer showcase ──
        (function(){
            if (typeof QRCodeStyling === 'undefined') return;
            const origin = window.location.origin;
            document.querySelectorAll('.qrbox[data-qr]').forEach(function(box){
                const url = box.getAttribute('data-qr');
                if (!url) return;
                try {
                    new QRCodeStyling({
                        width: 112, height: 112, margin: 0,
                        data: url,
                        dotsOptions: { type: 'rounded', color: '#1E1A3C' },
                        cornersSquareOptions: { type: 'extra-rounded', color: '#6366F1' },
                        backgroundOptions: { color: '#ffffff' }
                    }).append(box);
                } catch (e) {}
            });
        })();

        // ── animated counters ──
        function lndCount(el){
            const target = parseInt(el.getAttribute('data-count')) || 0;
            let cur = 0; const step = Math.max(1, target / 55);
            const tm = setInterval(function(){ cur += step; if (cur >= target){ cur = target; clearInterval(tm); } el.textContent = Math.floor(cur).toLocaleString('en-US'); }, 22);
        }
        const lndStats = document.getElementById('stats');
        if (lndStats && 'IntersectionObserver' in window){
            const io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ e.target.querySelectorAll('.sn[data-count]').forEach(lndCount); io.unobserve(e.target); } }); }, { threshold: .3 });
            io.observe(lndStats);
        } else if (lndStats){
            lndStats.querySelectorAll('.sn[data-count]').forEach(lndCount);
        }

        // ── show all customers ──
        function showAllCusts(){
            document.querySelectorAll('.cust.extra').forEach(function(e){ e.classList.add('show'); });
            const b = document.getElementById('custMore'); if (b) b.style.display = 'none';
        }

        // ── per-customer language (name/address switch with the page language) ──
        function applyCustLang(){
            const l = (window.I18N && window.I18N.getLang) ? window.I18N.getLang() : 'ku';
            document.querySelectorAll('.cust .ml').forEach(function(el){
                el.textContent = el.getAttribute('data-' + l) || el.getAttribute('data-ku') || el.getAttribute('data-en') || '';
            });
        }
        document.addEventListener('langchange', applyCustLang);
        applyCustLang();

        // ── brand title: ku ↔ en typewriter; | stays at end ──
        (function(){
            var ORDER = ['ku', 'en'];
            var idx = 0;
            function brandTypewriter(){
                var word = document.querySelector('.brand .brand-tw');
                var STR = window.I18N && window.I18N.STR;
                if (!word || !STR || !STR.lnd_brand) return;
                clearInterval(word._tw);
                clearTimeout(word._twPause);
                word._twActive = true;
                function plain(html){ var s = document.createElement('span'); s.innerHTML = html; return s.textContent || ''; }
                function typeOne(lang, done){
                    if (!word._twActive) return;
                    var html = STR.lnd_brand[lang] || '';
                    var text = plain(html);
                    word.textContent = '';
                    word.classList.add('typing');
                    var i = 0;
                    word._tw = setInterval(function(){
                        word.textContent = text.slice(0, ++i);
                        if (i >= text.length){
                            clearInterval(word._tw);
                            word.classList.remove('typing');
                            word.innerHTML = html;
                            word._twPause = setTimeout(function(){
                                if (!word._twActive) return;
                                word.textContent = '';
                                word.classList.add('typing');
                                var j = text.length;
                                word._tw = setInterval(function(){
                                    word.textContent = text.slice(0, --j);
                                    if (j <= 0){ clearInterval(word._tw); word.classList.remove('typing'); done(); }
                                }, 38);
                            }, 2200);
                        }
                    }, 88);
                }
                function cycle(){
                    if (!word._twActive) return;
                    typeOne(ORDER[idx], function(){
                        idx = (idx + 1) % ORDER.length;
                        word._twPause = setTimeout(cycle, 500);
                    });
                }
                cycle();
            }
            brandTypewriter();
        })();
    </script>
