<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main S shape -->
  <path d="M30 35 Q30 25 40 25 L55 25 Q65 25 65 35 Q65 45 55 45 L45 45 Q35 45 35 55 Q35 65 45 65 L60 65 Q70 65 70 75 Q70 85 60 85 L40 85 Q30 85 30 75" 
        stroke="url(#logoGradient)" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Decorative dots -->
  <circle cx="75" cy="30" r="3" fill="#6366f1" opacity="0.8"/>
  <circle cx="25" cy="70" r="2" fill="#06b6d4" opacity="0.6"/>
  <circle cx="80" cy="60" r="2" fill="#8b5cf6" opacity="0.7"/>
</svg>
